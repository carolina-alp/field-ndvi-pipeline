name: CI Pipeline

# Se ejecuta automáticamente en cada push o pull request hacia la rama main
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest # Levanta un servidor virtual con Linux Ubuntu en la nube

    steps:
      # 1. Descarga tu código fuente desde el repositorio de GitHub
      - name: Check out repository code
        uses: actions/checkout@v4

      # 2. Prepara el entorno de Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Instala todas las dependencias declaradas en requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Corre tus pruebas unitarias creadas con pytest
      - name: Run unit tests with Pytest
        run: |
          pytest tests/